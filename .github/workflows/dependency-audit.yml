name: Dependency audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: runtime
            requirements: requirements.txt
          - name: development
            requirements: requirements-dev.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install auditor
        run: python -m pip install pip-audit==2.10.1
      - name: Resolve and audit dependencies (fail on vulnerabilities or resolution errors)
        run: >-
          python -m pip_audit -r ${{ matrix.requirements }} --strict
          --format=json --output=dependency-audit.json
      - name: Preserve audit evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ matrix.name }}
          path: dependency-audit.json
          if-no-files-found: warn
          retention-days: 14
