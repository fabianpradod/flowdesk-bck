services:
  db:
    image: postgres:16
    container_name: flowdesk-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME must be set in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: flowdesk-api
    restart: always
    env_file:
      - .env
    environment:
      DB_SERVER: db
      DB_PORT: "5432"
    ports:
      - "80:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
